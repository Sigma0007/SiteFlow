# Cloudflare Worker Configuration
# This file configures your Cloudflare Worker deployment

name = "site-manager-notifications"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Environment variables (secrets)
# These will be set via: wrangler secret put ONESIGNAL_APP_ID
# and: wrangler secret put ONESIGNAL_REST_API_KEY
#
# DO NOT put actual secrets here! Use wrangler secret put command.

# Variables (non-secret, can be set here)
# [vars]
# ENVIRONMENT = "production"

# Triggers (optional - for scheduled tasks)
# [triggers]
# crons = ["0 * * * *"]  # Run every hour

# Limits (optional)
# [limits]
# cpu_ms = 50  # CPU time limit in milliseconds

# KV Namespaces (if needed for caching)
# [[kv_namespaces]]
# binding = "CACHE"
# id = "your-kv-namespace-id"

# D1 Database (if needed)
# [[d1_databases]]
# binding = "DB"
# database_name = "site-manager-db"
# database_id = "your-database-id"
