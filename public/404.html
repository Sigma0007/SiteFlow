<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sites Flow</title>
  <script>
    // GitHub Pages SPA redirect
    // This script redirects 404 pages back to index.html with the original path
    // preserved so react-router can handle it.
    var pathSegmentsToKeep = 1; // keep '/SiteFlow' prefix
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
